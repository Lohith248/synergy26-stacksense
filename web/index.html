<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>StackSense</title>
<meta name="description" content="StackSense: describe a software project and get a justified tech-stack recommendation (frontend, backend, database, hosting). Runs offline on a local server; no LLM.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fd1'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<script>
/* theme first, to avoid a flash: saved choice > #theme= > OS preference */
(function () {
  var t = "auto";
  try { t = localStorage.getItem("ss-theme") || "auto"; } catch (e) {}
  var m = /theme=(light|dark)/.exec(location.hash);
  if (m) t = m[1];
  var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pref = t;
})();
</script>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--panel2:#f7f8fb;--ink:#151b26;--muted:#556070;--line:#d9dee7;--line2:#7d8798;
  --accent:#1f4fd1;--accent-bg:#e7edfc;--btn:#1f4fd1;--btnink:#fff;--focus:#1f4fd1;
  --ok:#14733f;--ok-bg:#e3f3ea;--warn:#7f5000;--warn-bg:#fbefd9;--crit:#b3261e;--crit-bg:#fce9e7;--info:#1f4fd1;--info-bg:#e7edfc;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);color-scheme:light;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r1:6px;--r2:10px;
  --t-xs:12px;--t-sm:13px;--t-md:14px;--t-lg:16px;--t-xl:20px;--t-2xl:24px;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}
:root[data-theme=dark]{
  --bg:#0f1217;--panel:#171b22;--panel2:#1d222b;--ink:#e8ecf3;--muted:#9aa5b5;--line:#2b323d;--line2:#6b778c;
  --accent:#8fb0ff;--accent-bg:#1a2540;--btn:#3a63d6;--btnink:#fff;--focus:#9bb8ff;
  --ok:#62c78f;--ok-bg:#14291f;--warn:#e8b45c;--warn-bg:#2c2210;--crit:#ff8c82;--crit-bg:#3a1b19;--info:#8fb0ff;--info-bg:#1a2540;
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-md)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,h4,p{margin:0}
code,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s2);top:-48px;background:var(--btn);color:var(--btnink);padding:var(--s2) var(--s3);border-radius:var(--r1);z-index:10}
.skip:focus{top:var(--s2)}
.muted{color:var(--muted)}
.wrap{overflow-wrap:anywhere;min-width:0}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4);padding:var(--s3) var(--s4);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;min-width:0}
.brand h1{font-size:var(--t-xl);letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:var(--t-sm)}
.badges{display:flex;gap:var(--s2);flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:var(--s1);padding:2px 10px;border:1px solid var(--line2);border-radius:999px;font-size:var(--t-xs);font-weight:600;color:var(--ink);background:var(--panel2);white-space:nowrap}

/* layout */
main{display:grid;grid-template-columns:minmax(380px,480px) minmax(0,1fr);gap:var(--s4);padding:var(--s4)}
.inpane,.respane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);min-width:0}
.respane{padding:var(--s4)}
.inpane{display:flex;flex-direction:column}
.inhead{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:grid;gap:var(--s2)}
.inbody{padding:var(--s3) var(--s4);flex:1;min-height:0}
.runbar{position:sticky;bottom:0;display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 var(--r2) var(--r2);z-index:2}
.runbar .hint{font-size:var(--t-xs);color:var(--muted)}
@media (min-width:901px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  main{flex:1;min-height:0}
  .inpane,.respane{overflow:auto;min-height:0}
  .inpane{overflow:hidden}
  .inbody{overflow:auto}
}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:var(--s3)}.badges{margin-left:0}.m-only{display:inline-flex}}

/* buttons and inputs */
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:6px 12px;border:1px solid var(--line2);border-radius:var(--r1);background:var(--panel);cursor:pointer;font-size:var(--t-sm);font-weight:500;min-height:34px}
.btn:hover:not(:disabled){background:var(--panel2);border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btnink);font-weight:600;padding:7px 18px}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--btn)}
.btn.sm{padding:2px 10px;min-height:26px;font-size:var(--t-xs)}
.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap}
select,input[type=text],input[type=number],textarea{width:100%;padding:6px 10px;border:1px solid var(--line2);border-radius:var(--r1);background:var(--panel);min-height:34px}
textarea{resize:vertical}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
[aria-busy=true] .spin,.btn.busy .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-right-color:currentColor;opacity:.6}*{scroll-behavior:auto!important;transition:none!important}}

/* tabs */
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line)}
.tabs [role=tab]{padding:6px 14px;border:1px solid transparent;border-bottom:0;border-radius:var(--r1) var(--r1) 0 0;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--t-sm);margin-bottom:-1px}
.tabs [role=tab][aria-selected=true]{color:var(--accent);background:var(--panel);border-color:var(--line);border-bottom:2px solid var(--panel);box-shadow:inset 0 2px 0 var(--accent)}

/* form */
.sec{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:var(--s3);background:var(--panel)}
.sec>summary{cursor:pointer;padding:var(--s2) var(--s3);font-weight:700;font-size:var(--t-sm);list-style:none;display:flex;justify-content:space-between;gap:var(--s2);align-items:center}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"+";font-weight:400;color:var(--muted);font-size:var(--t-lg)}
.sec[open]>summary::after{content:"\2212"}
.sec .secdesc{padding:0 var(--s3);color:var(--muted);font-size:var(--t-xs);margin-top:calc(-1*var(--s1))}
.secbody{padding:var(--s3);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3) var(--s3);border-top:1px solid var(--line);margin-top:var(--s2)}
.field{min-width:0;border-radius:var(--r1);padding:var(--s1);margin:calc(-1*var(--s1))}
.field.wide{grid-column:1/-1}
.flabel{font-weight:600;font-size:var(--t-sm);display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap}
.req{font-size:11px;font-weight:700;color:var(--crit);text-transform:uppercase;letter-spacing:.04em}
.fmeta{font-size:11px;color:var(--muted);margin:1px 0 var(--s1);overflow-wrap:anywhere}
.fmeta code{color:var(--ink);background:var(--panel2);padding:0 4px;border-radius:3px}
.fnote{font-size:var(--t-xs);margin-top:var(--s1);color:var(--warn)}
.fnote:empty{display:none}
.field.invalid input:not([type=radio]):not([type=checkbox]),.field.invalid select,.field.invalid textarea{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.field.invalid .seg,.field.invalid .checks{outline:1px solid var(--crit);outline-offset:2px}
.field .ferr{color:var(--crit);font-size:var(--t-xs);margin-top:var(--s1);font-weight:600}
.field .ferr:empty{display:none}
.field.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,60%{background:var(--accent-bg);box-shadow:0 0 0 4px var(--accent-bg)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
@media (prefers-reduced-motion:reduce){.field.flash{animation:none;background:var(--accent-bg);box-shadow:0 0 0 4px var(--accent-bg)}}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:var(--r1);overflow:hidden;max-width:100%}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 11px;min-width:34px;text-align:center;font-size:var(--t-sm);border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0;color:var(--muted)}
.seg input:checked+span{background:var(--btn);color:var(--btnink);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-3px}
.checks{display:flex;flex-wrap:wrap;gap:var(--s2)}
.checks label{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px solid var(--line2);border-radius:999px;font-size:var(--t-sm);cursor:pointer}
.checks label:has(input:checked){background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.notice{font-size:var(--t-xs);color:var(--muted);margin-bottom:var(--s3);overflow-wrap:anywhere}
.notice:empty{display:none}
#inErr{color:var(--crit);font-size:var(--t-sm);margin-bottom:var(--s3);overflow-wrap:anywhere}
#inErr:empty{display:none}
#json{min-height:55vh;font:var(--t-xs)/1.5 var(--mono);tab-size:2;white-space:pre}
#jsonStat{font-size:var(--t-xs);margin-top:var(--s2);overflow-wrap:anywhere}
#jsonStat.bad{color:var(--crit)}#jsonStat.good{color:var(--ok)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

/* results */
.reshead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.reshead h2{font-size:var(--t-xl)}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
#actMsg{font-size:var(--t-xs);color:var(--muted)}
h3.sh{font-size:var(--t-lg);margin:var(--s5) 0 var(--s3);display:flex;gap:var(--s2);align-items:baseline}
h3.sh small{font-size:var(--t-xs);color:var(--muted);font-weight:400}
h3.sh .btn{margin-left:auto;align-self:center}
h3.sh{flex-wrap:wrap}
#resH:focus,#resH:focus-visible{outline:none}
.banner{border:1px solid;border-left-width:6px;border-radius:var(--r2);padding:var(--s3) var(--s4)}
.banner .brow{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.banner .st{font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:var(--t-sm)}
.banner .sid{font-weight:700}
.banner .meaning{font-size:var(--t-sm);margin-top:var(--s1)}
.banner .summary{margin-top:var(--s3);color:var(--ink)}
.banner.s-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.banner.s-ok_with_warnings{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.banner.s-infeasible,.banner.s-invalid_input{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.banner .summary,.banner .sid,.banner .meaning{color:var(--ink)}
.kpis,.glance,.supgrid{display:grid;gap:var(--s3)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:var(--s4)}
.glance{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.supgrid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi,.gcard,.sup,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);min-width:0}
.kpi{padding:var(--s3) var(--s4)}
.kpi .k{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi .v{font-size:var(--t-xl);font-weight:700;margin:2px 0;overflow-wrap:anywhere}
.kpi .sub{font-size:var(--t-xs);color:var(--muted)}
.kpi.wide{grid-column:1/-1}
.cbar{position:relative;height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;margin:var(--s3) 0 var(--s1)}
.cbar .rng{position:absolute;top:-1px;bottom:-1px;border-radius:999px;background:var(--accent);min-width:4px}
.cbar .rng.over{background:var(--warn)}.cbar .rng.way{background:var(--crit)}
.cbar .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.cbar .mk::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;margin-top:2px}
.cbar .mk.l::after{left:0;transform:none}.cbar .mk.r::after{left:auto;right:0;transform:none}
.cbar-wrap{padding:0 6px 22px}
.costwhy{font-size:var(--t-xs);margin-top:var(--s1);text-align:left}
.sevs{display:flex;gap:var(--s3);flex-wrap:wrap;margin:2px 0}
.sevs span{font-size:var(--t-md);font-weight:700}
.sevs .critical{color:var(--crit)}.sevs .warning{color:var(--warn)}.sevs .info{color:var(--info)}.sevs .zero{color:var(--muted);font-weight:500}
.gcard{padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s1);text-align:left;cursor:pointer;width:100%;color:inherit;font:inherit}
.gcard:hover{border-color:var(--accent)}
.gcard .l{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.gcard .c{font-weight:700;font-size:var(--t-md);overflow-wrap:anywhere}
.gcard .m{font-size:var(--t-xs);color:var(--muted);overflow-wrap:anywhere}
.chg{display:inline-block;font-size:var(--t-xs);font-weight:700;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--r1);padding:0 6px;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap;width:max-content}
.badge i{font-style:normal;letter-spacing:1px;font-size:9px}
.conf-high{color:var(--ok);background:var(--ok-bg)}.conf-medium{color:var(--warn);background:var(--warn-bg)}.conf-low{color:var(--crit);background:var(--crit-bg)}
.panel{margin-bottom:var(--s3)}
.panel>summary{cursor:pointer;padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;list-style:none}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::before{content:"\25B8";color:var(--muted);transition:transform .15s}
.panel[open]>summary::before{transform:rotate(90deg)}
.panel>summary .lay{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;min-width:70px}
.panel>summary .ch{font-weight:700;overflow-wrap:anywhere;min-width:0;flex:1 1 200px}
.pbody{padding:0 var(--s4) var(--s4);display:grid;gap:var(--s3);border-top:1px solid var(--line);padding-top:var(--s3)}
.pbody h4,.sup h4{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:var(--s1)}
.pbody ul,.sup ul,.alist{margin:0;padding-left:var(--s5)}
.pbody li,.sup li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{display:inline-flex;align-items:center;min-height:24px;font:var(--t-xs)/1.4 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:1px 7px;color:var(--ink);overflow-wrap:anywhere;text-align:left}
button.chip{cursor:pointer;color:var(--accent);border-color:var(--accent)}
button.chip:hover{background:var(--accent-bg)}
.fact{font-size:var(--t-xs);background:var(--panel2);border-radius:var(--r1);padding:1px 8px;border:1px solid var(--line)}
.meter{height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden;width:140px;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--accent)}
.alt{border-left:3px solid var(--line2);padding:2px var(--s3);margin:var(--s2) 0}
.alt b{overflow-wrap:anywhere}
.wwc{display:grid;gap:var(--s2)}
.wwc .item{border:1px solid var(--line);border-radius:var(--r1);padding:var(--s2) var(--s3);background:var(--panel2)}
.wwc .row{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;flex-wrap:wrap}
.sup{padding:var(--s3) var(--s4);display:grid;gap:var(--s2);align-content:start}
.sup .t{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.sup .c{font-weight:700;overflow-wrap:anywhere}
details.mini>summary{cursor:pointer;color:var(--muted);font-size:var(--t-sm)}
details.mini{margin-top:2px}
.warn{border:1px solid var(--line);border-left-width:5px;border-radius:var(--r1);padding:var(--s2) var(--s3);margin:var(--s2) 0;background:var(--panel)}
.warn.critical{border-left-color:var(--crit)}.warn.warning{border-left-color:var(--warn)}.warn.info{border-left-color:var(--info)}
.warn .wh{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.sev{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.sev.critical{color:var(--crit)}.sev.warning{color:var(--warn)}.sev.info{color:var(--info)}
.warn .code{font:var(--t-xs) var(--mono);color:var(--muted)}
.warn p{margin:2px 0 var(--s1)}
.verr{border:1px solid var(--crit);background:var(--crit-bg);border-radius:var(--r2);padding:var(--s3) var(--s4);margin-top:var(--s4)}
.verr h3{font-size:var(--t-md);color:var(--crit);margin-bottom:var(--s2)}
.verr li{margin:var(--s1) 0}
.strip{margin-top:var(--s3);padding:var(--s2) var(--s3);border:1px solid var(--line2);border-left:5px solid var(--accent);border-radius:var(--r1);background:var(--panel2);font-size:var(--t-sm)}
.strip ul{margin:var(--s1) 0 0;padding-left:var(--s5)}
.empty{max-width:640px;margin:var(--s5) auto;padding:var(--s2)}
.empty h3{font-size:var(--t-xl);margin-bottom:var(--s3)}
.empty .lead{font-size:var(--t-lg);margin-bottom:var(--s4)}
.empty h4{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s3);margin:var(--s2) 0 var(--s4)}
.example{display:flex;flex-direction:column;gap:2px;text-align:left;padding:var(--s3) var(--s4);border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);cursor:pointer;min-height:56px;font:inherit;color:inherit}
.example:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.example:disabled{opacity:.55;cursor:not-allowed}
.example span{font-size:var(--t-xs);color:var(--muted)}
.busybar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3);padding:var(--s2) var(--s3);border:1px solid var(--line2);border-radius:var(--r1);background:var(--panel2);font-size:var(--t-sm)}
.m-only{display:none}
.errbox{border:1px solid var(--crit);background:var(--crit-bg);border-radius:var(--r2);padding:var(--s4);display:grid;gap:var(--s3);justify-items:start}
.errbox h3{color:var(--crit);font-size:var(--t-lg)}
.swhead{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;font-size:var(--t-sm);margin-bottom:var(--s2)}
.swhead .counts{display:flex;gap:var(--s3);flex-wrap:wrap}

<body>
<a class="skip" href="#results" id="skipTop">Skip to results</a>
<header class="top">
  <div class="brand">
    <h1>StackSense</h1>
    <p>Describe a project; get a justified, auditable tech-stack recommendation.</p>
  </div>
  <div class="badges">
    <span class="badges" role="list" aria-label="Product properties">
      <span class="pill" role="listitem" tabindex="0" title="Offline: nothing leaves this machine. No internet calls, no accounts.">Offline</span>
      <span class="pill" role="listitem" tabindex="0" title="Deterministic: the same input always gives the same stack.">Deterministic</span>
      <span class="pill" role="listitem" tabindex="0" title="No LLM: rules and weighted scoring choose every component. No AI model is asked.">No LLM</span>
    </span>
    <button type="button" class="btn sm" id="themeBtn" title="Switch colour theme: auto, light or dark">Theme: auto</button>
  </div>
</header>
<main>
<section class="inpane" aria-labelledby="inH">
  <div class="inhead">
    <h2 class="sr-only" id="inH">Scenario input</h2>
    <select id="sample" aria-label="Load a sample scenario"><option value="">Load a sample scenario</option></select>
    <div class="toolbar">
      <input type="file" id="file" accept=".json,application/json" hidden>
      <button type="button" class="btn primary runbtn m-only" id="runTop"><span class="spin" aria-hidden="true"></span><span class="runlbl">Recommend</span></button>
      <button type="button" class="btn" id="importBtn">Import JSON</button>
      <button type="button" class="btn" id="exportIn">Export input</button>
      <button type="button" class="btn" id="reset">Reset</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Input view" id="inTabs">
      <button type="button" role="tab" id="tabForm" aria-controls="form" aria-selected="true" tabindex="0">Form</button>
      <button type="button" role="tab" id="tabJson" aria-controls="jsonPanel" aria-selected="false" tabindex="-1">JSON</button>
    </div>
  </div>
  <div class="inbody">
    <div id="inErr" role="alert"></div>
    <div id="inNote" class="notice"></div>
    <div id="form" role="tabpanel" aria-labelledby="tabForm"></div>
    <div id="jsonPanel" role="tabpanel" aria-labelledby="tabJson" hidden>
      <label class="sr-only" for="json">Scenario JSON</label>
      <textarea id="json" spellcheck="false" autocomplete="off" aria-describedby="jsonStat"></textarea>
      <div id="jsonStat" role="status"></div>
    </div>
  </div>
  <div class="runbar">
    <button type="button" class="btn primary runbtn" id="run"><span class="spin" aria-hidden="true"></span><span class="runlbl">Recommend</span></button>
    <span class="hint">Ctrl/Cmd + Enter</span>
    <button type="button" class="btn sm" id="skipRes" hidden>Skip to results</button>
  </div>
</section>
<section class="respane" id="results" aria-labelledby="resH" tabindex="-1">
  <div class="reshead">
    <h2 id="resH">Recommendation</h2>
    <div class="actions" id="actions" hidden>
      <button type="button" class="btn" id="exportOut">Export output JSON</button>
      <button type="button" class="btn" id="exportAll" hidden>Export all</button>
      <button type="button" class="btn" id="copyOut">Copy JSON</button>
      <button type="button" class="btn" id="printBtn">Print report</button>
      <span id="actMsg" role="status"></span>
    </div>
  </div>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <div id="busyBar" class="busybar" hidden><div class="spin" style="display:inline-block" aria-hidden="true"></div><span id="busyTxt"></span><button type="button" class="btn sm" id="cancelRun">Cancel</button></div>
  <div id="runMsg" class="notice" role="status"></div>
  <div id="resBody" aria-busy="false"></div>
</section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LAYERS = [["frontend", "Frontend"], ["backend", "Backend"], ["database", "Database"], ["hosting", "Hosting"]];
const STATUS = {
  ok: ["OK", "●", "Valid input and a complete stack with no risks that need attention."],
  ok_with_warnings: ["OK with warnings", "▲", "A complete stack was chosen, but some inputs conflict or carry risk."],
  infeasible: ["Infeasible", "■", "The hard constraints cannot all be met together. The warnings name the conflict; relax one input and run again."],
  invalid_input: ["Invalid input", "✕", "The input was rejected before any stack was chosen. Fix the listed fields and run again."],
};
const LABELS = {
  scenario_id: "Scenario ID", "project.name": "Project name", "project.type": "Project type", "project.description": "Description", "project.platforms": "Target platforms",
  "scale.users_at_launch": "Users at launch", "scale.users_12_months": "Users after 12 months", "scale.peak_concurrent_users": "Peak concurrent users",
  "scale.traffic_pattern": "Traffic pattern", "scale.workload": "Workload mix", "scale.data_volume_gb_12_months": "Data volume after 12 months (GB)",
  "scale.peak_rps": "Peak requests per second", "scale.geo_spread": "Geographic spread",
  "team.size": "Team size", "team.experience": "Team experience", "team.languages": "Languages the team knows", "team.has_devops": "Has a DevOps engineer", "team.hiring_languages": "Languages you can hire for",
  "budget.monthly_infra_usd": "Monthly infrastructure budget (USD)", "timeline.mvp_weeks": "Weeks to MVP",
  "infrastructure.cloud_preference": "Cloud preference", "infrastructure.deployment_model": "Deployment model", "infrastructure.data_residency": "Data residency",
  "infrastructure.existing_systems": "Existing systems", "infrastructure.lock_in_tolerance": "Vendor lock-in tolerance",
  "requirements.realtime": "Real-time updates", "requirements.offline_support": "Offline support", "requirements.full_text_search": "Full-text search",
  "requirements.file_media_storage": "File and media storage", "requirements.payments": "Payments", "requirements.auth": "Authentication", "requirements.multi_tenant": "Multi-tenant",
  "requirements.ml_features": "ML features", "requirements.seo_critical": "SEO-critical", "requirements.availability": "Availability target (%)", "requirements.p95_latency_ms": "p95 latency target (ms)",
  "requirements.rto_minutes": "Recovery time objective (min)", "requirements.rpo_minutes": "Recovery point objective (min)",
  compliance: "Compliance regimes",
  "priorities.cost": "Low running cost", "priorities.time_to_market": "Fast delivery", "priorities.scalability": "Scalability", "priorities.performance": "Performance",
  "priorities.maintainability": "Maintainability", "priorities.security": "Security",
};
// The number stays in the tooltip; the visible text is qualitative (same 1.5 threshold as the engine's "(close call)").
const marginWord = m => m < 0 ? "chosen for team skill" : m < 1.5 ? "close call" : "clear lead";
const marginTip = m => `Score margin ${m}: the gap between the best and second-best option on the engine's weighted score. A bigger gap means a clearer win.`;
const SEVG = {critical: "▲", warning: "●", info: "○"}, SEVORD = {critical: 0, warning: 1, info: 2};
const SECTIONS = [
  ["project", "Project", f => f.path === "scenario_id" || f.path.startsWith("project."), ""],
  ["scale", "Scale", f => f.path.startsWith("scale."), ""],
  ["team", "Team", f => f.path.startsWith("team."), ""],
  ["budget", "Budget & timeline", f => /^(budget|timeline)\./.test(f.path), ""],
  ["infra", "Infrastructure", f => f.path.startsWith("infrastructure."), ""],
  ["req", "Requirements", f => f.path.startsWith("requirements."), "Unset booleans fall back to false and are listed under assumptions."],
  ["comp", "Compliance", f => f.path === "compliance", ""],
  ["prio", "Priorities", f => f.path.startsWith("priorities."), "1 = least important, 5 = most important. Unset means 3."],
  ["extra", "Extra inputs", f => false, "Optional extras beyond the base schema."],
];

let SCHEMA = [], SAMPLES = [], FIELDS = new Map(), STASH = {}, mode = "form";
let RES = null, PREV = {}, LASTEDIT = null, busy = false, READY = false, ABORT = null;
let baseText = null, dirty = false;  // baseText: the loaded scenario text, sent verbatim until the form is touched

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}
const getPath = (o, p) => p.split(".").reduce((a, k) => (a && typeof a === "object" && k in a) ? a[k] : undefined, o);
function setPath(o, p, v) { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => { if (typeof a[k] !== "object" || a[k] === null) a[k] = {}; a = a[k]; }); a[ks.at(-1)] = v; }
function deletePath(o, p) {
  const ks = p.split("."), stack = [o]; let a = o;
  for (const k of ks.slice(0, -1)) { if (!a || typeof a !== "object" || !(k in a)) return; a = a[k]; stack.push(a); }
  if (a && typeof a === "object") delete a[ks.at(-1)];
  for (let i = ks.length - 1; i > 0; i--) { const par = stack[i - 1], child = stack[i]; if (child && typeof child === "object" && !Array.isArray(child) && !Object.keys(child).length) delete par[ks[i - 1]]; else break; }
}
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
function deepFill(o, extra) { for (const [k, v] of Object.entries(extra)) { if (!(k in o)) o[k] = structuredClone(v); else if (isObj(o[k]) && isObj(v)) deepFill(o[k], v); } return o; }

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const human = s => cap(String(s || "").replace(/_/g, " "));
const usd = n => "$" + Number(n).toLocaleString("en-US");
const INR_PER_USD = 90;  // display only; same planning rate as engine/costreal.py INR_PER_USD (keep in sync)
const inrFmt = n => "₹" + Math.round(Number(n) * INR_PER_USD).toLocaleString("en-IN");
const fmtDefault = d => d === null || d === undefined ? null : Array.isArray(d) ? (d.length ? d.join(", ") : "none") : String(d);
function say(msg) { $("announce").textContent = ""; setTimeout(() => { $("announce").textContent = msg; }, 30); }
function flashMsg(msg) { $("actMsg").textContent = msg; clearTimeout(flashMsg.t); flashMsg.t = setTimeout(() => { $("actMsg").textContent = ""; }, 3000); }

/* ---------- theme ---------- */
function applyTheme(pref) {
  const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light"; document.documentElement.dataset.pref = pref;
  $("themeBtn").textContent = "Theme: " + pref;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (document.documentElement.dataset.pref === "auto") applyTheme("auto"); });
$("themeBtn").onclick = () => {
  const next = {auto: "light", light: "dark", dark: "auto"}[document.documentElement.dataset.pref] || "auto";
  try { localStorage.setItem("ss-theme", next); } catch (e) { /* storage may be blocked */ }
  applyTheme(next);
};
applyTheme(document.documentElement.dataset.pref);

/* ---------- tab wiring (arrow keys, roving tabindex) ---------- */
function wireTabs(list, onActivate) {
  list.addEventListener("keydown", e => {
    const tabs = [...list.querySelectorAll("[role=tab]")], i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    let n = i;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") n = (i + 1) % tabs.length;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") n = 0; else if (e.key === "End") n = tabs.length - 1; else return;
    e.preventDefault(); tabs[n].focus(); onActivate(tabs[n]);
  });
}

/* ---------- form ---------- */
function makeControl(fd, id, described) {
  const k = fd.kind, req = fd.required;
  const emptyOk = !req;
  let el, root, ctl;
  const common = {id, "aria-describedby": described};
  if (k === "enum") {
    el = h("select", common, h("option", {value: "", text: req ? "Choose..." : "Unset" + (fmtDefault(fd.default) ? " (default: " + fmtDefault(fd.default) + ")" : "")}));
    fd.choices.forEach(o => el.append(h("option", {value: o, text: o})));
    ctl = {root: el, get: () => el.value === "" ? undefined : el.value, set: v => { el.value = v === undefined ? "" : v; }, fits: v => typeof v === "string" && fd.choices.includes(v), focus: () => el.focus(), inputs: [el]};
  } else if (k === "bool" || k === "prio") {
    const opts = k === "bool" ? [["", "Unset"], ["true", "Yes"], ["false", "No"]] : [["", "Unset"], ...[1, 2, 3, 4, 5].map(n => [String(n), String(n)])];
    root = h("div", {class: "seg", role: "radiogroup", "aria-labelledby": "lbl-" + fd.path, "aria-describedby": described});
    opts.forEach(([v, t]) => root.append(h("label", {}, h("input", {type: "radio", name: "r-" + fd.path, value: v, ...(v === "" ? {checked: true} : {})}), h("span", {text: t}))));
    const radios = [...root.querySelectorAll("input")];
    ctl = {root, inputs: radios,
      get: () => { const c = radios.find(r => r.checked).value; return c === "" ? undefined : k === "bool" ? c === "true" : Number(c); },
      set: v => { const s = v === undefined ? "" : String(v); (radios.find(r => r.value === s) || radios[0]).checked = true; },
      fits: v => k === "bool" ? typeof v === "boolean" : Number.isInteger(v) && v >= 1 && v <= 5,
      focus: () => (radios.find(r => r.checked) || radios[0]).focus()};
  } else if (k === "enum_list" || k === "enum_list0") {
    root = h("div", {class: "checks", role: "group", "aria-labelledby": "lbl-" + fd.path, "aria-describedby": described});
    fd.choices.forEach(o => root.append(h("label", {}, h("input", {type: "checkbox", value: o}), o)));

    let order = [], keepEmpty = false;  // loaded order first, newly ticked items after; a loaded [] stays []
    root.addEventListener("change", () => { keepEmpty = false; });
    ctl = {root, inputs: boxes,
      get: () => { const on = boxes.filter(b => b.checked).map(b => b.value); return on.length ? [...order.filter(x => on.includes(x)), ...on.filter(x => !order.includes(x))] : keepEmpty ? [] : undefined; },
      set: v => { order = Array.isArray(v) ? v.slice() : []; keepEmpty = Array.isArray(v) && v.length === 0; boxes.forEach(b => { b.checked = Array.isArray(v) && v.includes(b.value); }); },
      fits: v => Array.isArray(v) && (emptyOk || v.length > 0) && v.every(x => fd.choices.includes(x)), focus: () => boxes[0].focus()};
  } else if (k === "int" || k === "num" || k === "opt_int") {

    ctl = {root: el, inputs: [el], get: () => el.value.trim() === "" ? undefined : Number(el.value), set: v => { el.value = v === undefined ? "" : String(v); },

  } else if (k === "str_list") {
    el = h("input", {...common, type: "text", placeholder: req ? "Comma separated, e.g. python, typescript" : "Comma separated"});
    let keepEmpty = false;
    el.addEventListener("input", () => { keepEmpty = false; });
    ctl = {root: el, inputs: [el], get: () => { const v = el.value.split(",").map(s => s.trim()).filter(Boolean); return el.value.trim() === "" ? (keepEmpty ? [] : undefined) : v; },
      set: v => { el.value = Array.isArray(v) ? v.join(", ") : ""; keepEmpty = Array.isArray(v) && v.length === 0; },
      fits: v => Array.isArray(v) && v.every(x => typeof x === "string" && !x.includes(",") && x.trim() === x && x) && (emptyOk || v.length > 0), focus: () => el.focus()};
  } else {
    el = fd.path === "project.description" ? h("textarea", {...common, rows: "3"}) : h("input", {...common, type: "text"});
    ctl = {root: el, inputs: [el], get: () => el.value.trim() === "" ? undefined : el.value.trim(), set: v => { el.value = v === undefined ? "" : String(v); },
      fits: v => typeof v === "string" && v === v.trim(), focus: () => el.focus()};
  }
  return ctl;
}

function makeField(fd) {
  const id = "fld-" + fd.path, grouped = ["bool", "prio", "enum_list", "enum_list0"].includes(fd.kind);
  const dflt = fmtDefault(fd.default);
  const meta = h("div", {class: "fmeta", id: "meta-" + fd.path}, h("code", {text: fd.path}),
    h("span", {text: fd.required ? "" : dflt ? "  default: " + dflt : "  optional"}));
  const ferr = h("div", {class: "ferr", id: "err-" + fd.path});
  const ctl = makeControl(fd, id, "meta-" + fd.path + " err-" + fd.path);
  const lblText = LABELS[fd.path] || human(fd.path.split(".").at(-1));
  const lbl = h(grouped ? "span" : "label", {id: "lbl-" + fd.path, for: grouped ? null : id}, lblText);
  const note = h("div", {class: "fnote", id: "note-" + fd.path});
  const row = h("div", {class: "field" + (grouped || fd.kind === "str_list" || fd.path === "project.description" ? " wide" : ""), "data-path": fd.path},
    h("div", {class: "flabel"}, lbl, fd.required ? h("span", {class: "req", text: "Required"}) : null), meta, ctl.root, note, ferr);
  const f = {fd, row, ctl, hasRaw: false, raw: undefined, section: null};

    else if (v !== null && ctl.fits(v)) ctl.set(v);
    else { ctl.set(undefined); f.hasRaw = true; f.raw = v; note.textContent = "Loaded value " + JSON.stringify(v) + " is not editable here (not a listed choice or wrong type). It is sent unchanged; change this control to replace it."; }
  };

  ctl.root.addEventListener("input", () => { dirty = true; f.clearRaw(); f.clearInvalid(); });
  ctl.root.addEventListener("change", () => { dirty = true; f.clearRaw(); f.clearInvalid(); });
  return f;
}

function buildForm() {
  const form = $("form"); form.textContent = ""; FIELDS = new Map();
  const all = [{path: "scenario_id", kind: "str", required: false, default: null}, ...SCHEMA];
  for (const [key, title, test, desc] of SECTIONS) {
    const fields = all.filter(fd => key === "extra" ? fd.extra : (!fd.extra && test(fd)));
    if (!fields.length) continue;
    const body = h("div", {class: "secbody"});
    const sec = h("details", {class: "sec", ...(key === "extra" ? {} : {open: true}), "data-sec": key}, h("summary", {text: title}), desc ? h("p", {class: "secdesc", text: desc}) : null, body);
    for (const fd of fields) { const f = makeField(fd); f.section = sec; FIELDS.set(fd.path, f); body.append(f.row); }
    form.append(sec);
  }
}

function formToObj() {
  const o = {};
  for (const f of FIELDS.values()) { const v = f.get(); if (v !== undefined) setPath(o, f.fd.path, v); }
  return deepFill(o, STASH);
}
function objToForm(o) {
  STASH = structuredClone(o);
  for (const f of FIELDS.values()) { f.set(getPath(o, f.fd.path)); deletePath(STASH, f.fd.path); }
  const left = leafKeys(STASH);
  $("inNote").textContent = left.length ? "Kept unchanged (no form field): " + left.join(", ") : "";
}

function clearInvalidAll() { FIELDS.forEach(f => f.clearInvalid()); }

function resolveField(p) {
  if (typeof p !== "string" || p === "$") return null;
  p = p.replace(/\[\d*\]/g, "");
  while (p) {
    if (FIELDS.has(p)) return FIELDS.get(p);
    for (const [k, f] of FIELDS) if (k.startsWith(p + ".")) return f;
    const i = p.lastIndexOf("."); if (i < 0) break; p = p.slice(0, i);
  }
  return null;
}

function gotoField(path) {
  const f = resolveField(path); if (!f) return;
  if (mode !== "form" && !setMode("form")) return;
  f.section.open = true;
  f.row.scrollIntoView({block: "center", behavior: REDUCED ? "auto" : "smooth"});
  f.focus();
  f.row.classList.remove("flash"); void f.row.offsetWidth; f.row.classList.add("flash");
  setTimeout(() => f.row.classList.remove("flash"), 2300);
}

/* ---------- mode / JSON ---------- */
function parseErr(text) {

      h("div", {class: "counts"}, Object.entries(counts).map(([s, c]) => h("span", {class: "g-" + s, text: `${glyphOf(s)} ${c} ${(STATUS[s] || [s])[0]}`})))));
    const sw = h("div", {class: "sw", role: "tablist", "aria-label": "Scenarios"});
    RES.docs.forEach((d, i) => sw.append(h("button", {type: "button", role: "tab", id: "sw-" + i, "aria-controls": "resPanel", "aria-selected": String(i === RES.sel), tabindex: i === RES.sel ? "0" : "-1",
      onclick: () => selectDoc(i)}, h("span", {class: "g g-" + d.status, "aria-hidden": "true", text: glyphOf(d.status)}), d.scenario_id || "scenario " + (i + 1), h("span", {class: "sr-only", text: " " + d.status}))));
    wireTabs(sw, tab => selectDoc(Number(tab.id.slice(3))));
    body.append(sw);
  }
  const panel = renderDoc(RES.sel);
  if (n > 1) { panel.setAttribute("role", "tabpanel"); panel.setAttribute("aria-labelledby", "sw-" + RES.sel); }
  body.append(panel);
  if (RES.docs.length === 1 && mode === "form") markInvalid(RES.docs[0]);
}
function selectDoc(i) {  // swap only the panel and the tab state; the switcher keeps its scroll and nothing big is announced
  RES.sel = i;
  document.querySelectorAll("#resBody .sw [role=tab]").forEach((t, k) => { t.setAttribute("aria-selected", String(k === i)); t.tabIndex = k === i ? 0 : -1; });
  const np = renderDoc(i); np.setAttribute("role", "tabpanel"); np.setAttribute("aria-labelledby", "sw-" + i);
  $("resPanel").replaceWith(np);
  const t = $("sw-" + i); if (t) t.focus({preventScroll: true});
  say(note(i));
}
function markInvalid(d) {
  clearInvalidAll();
  for (const e of d.validation_errors || []) { const f = resolveField(e.field); if (f) f.setInvalid(e.message); }
  if (d.status === "infeasible") {  // show the hard conflict beside each field it names; the full text stays in the result
    for (const w of d.warnings || []) {
      if (w.severity !== "critical") continue;
      for (const p of w.fields || []) { const f = resolveField(p); if (f && !f.row.classList.contains("invalid")) f.setInvalid(`Conflict (${w.code}): ${String(w.message).split(". ")[0].replace(/\.$/, "")}. Change this or the other named field.`); }
    }
  }
}

function emptyState() {
  const ex = [["P2", "Marketplace app in India"], ["P4", "Fintech with RBI and PCI rules"], ["E3", "Inputs that contradict each other"], ["E2", "Invalid input, rejected with reasons"]]
    .map(([id, hint]) => [findSample(id), hint]).filter(x => x[0] >= 0);
  return h("div", {class: "empty"}, h("h3", {text: "Pick a tech stack for a software project"}),
    h("p", {class: "lead", text: "Describe a project (users, team, budget, legal rules) and StackSense chooses a frontend, backend, database and hosting, with the reasons, a monthly cost range and what would change the answer."}),
    h("h4", {text: "Run an example"}),
    h("div", {class: "examples"}, ex.map(([i, hint]) => h("button", {type: "button", class: "example runbtn-ex", disabled: !READY, onclick: () => runExample(i)}, h("b", {text: SAMPLES[i].label}), h("span", {text: hint})))),
    h("p", {class: "muted"}, "Or ", h("button", {type: "button", class: "linkbtn", onclick: () => $("file").click(), text: "import a scenario JSON file"}), ", or ",
      h("button", {type: "button", class: "linkbtn", onclick: () => { const f = FIELDS.values().next().value; if (mode !== "form") setMode("form"); if (f) { f.row.scrollIntoView({block: "center"}); f.focus(); } }, text: "fill in the form"}), "."));
}
function runExample(i) { $("sample").value = String(i); loadSampleAt(i); run(); }

function errorState(title, detail, retry) {
  const body = $("resBody"); body.textContent = ""; body.setAttribute("aria-busy", "false"); $("actions").hidden = true; $("skipRes").hidden = true;
  body.append(h("div", {class: "errbox", role: "alert"}, h("h3", {text: title}), h("p", {class: "wrap", text: detail}),
    retry ? h("button", {type: "button", class: "btn", onclick: retry, text: "Retry"}) : null));
  say(title);
}

/* ---------- run ---------- */
function syncRun() {
  document.querySelectorAll(".runbtn").forEach(b => { b.disabled = busy || !READY; b.classList.toggle("busy", busy); b.setAttribute("aria-busy", String(busy)); });
  document.querySelectorAll(".runbtn-ex").forEach(b => { b.disabled = busy || !READY; });
  document.querySelectorAll(".runlbl").forEach(l => { l.textContent = busy ? "Running..." : "Recommend"; });
}
function setBusy(b, n = 1) {
  busy = b; syncRun(); $("resBody").setAttribute("aria-busy", String(b)); $("resBody").style.opacity = b ? ".45" : "";
  $("busyBar").hidden = !b;
  if (b) $("busyTxt").textContent = n > 1 ? `Evaluating ${n} scenarios (about ~0.2 s each, ~${Math.max(1, Math.round(n * 0.2))} s in all)...` : "Evaluating the scenario on the local engine...";
}
function goResults() {
  const mobile = matchMedia("(max-width:900px)").matches;
  if (mobile) $("results").scrollIntoView({behavior: REDUCED ? "auto" : "smooth", block: "start"});
  $("resH").tabIndex = -1; $("resH").focus({preventScroll: mobile});
}
function afterRun(noScroll) {
  const r = $("resH").getBoundingClientRect(), seen = r.top >= 0 && r.bottom <= innerHeight;
  if (noScroll) { $("resH").tabIndex = -1; $("resH").focus({preventScroll: true}); }
  else if (matchMedia("(max-width:900px)").matches) goResults();
  else { $("resH").tabIndex = -1; $("resH").focus({preventScroll: seen}); }
}

async function run(opts = {}) {
  if (busy || !READY) return;
  if (!opts.keepEdit) LASTEDIT = null;
  $("inErr").textContent = ""; $("runMsg").textContent = ""; clearInvalidAll();
  const text = currentText();
  if (!text.trim()) { $("inErr").textContent = "Paste or import a scenario first"; if (mode === "json") $("json").focus(); return; }
  if (mode === "json") updateJsonStat();
  let parsed = null; try { parsed = JSON.parse(text); } catch (e) { /* the engine reports JSON errors itself */ }
  ABORT = new AbortController();
  setBusy(true, Array.isArray(parsed) ? parsed.length : 1);
  let r, raw;
  try {
    r = await fetch("/api/evaluate?format=files", {method: "POST", headers: {"Content-Type": "application/json"}, body: text, signal: ABORT.signal});
    raw = await r.text();
  } catch (e) {
    setBusy(false);
    if (e && e.name === "AbortError") { renderResults(); $("runMsg").textContent = "Run cancelled. Your input is unchanged."; say("Run cancelled"); return; }
    errorState("Cannot reach the StackSense server", "Cannot reach the StackSense server — is `python stacksense.py serve` still running? Your input is unchanged.", () => run());
    return;
  }
  setBusy(false);
  let body = null; try { body = JSON.parse(raw); } catch (e) { /* not JSON */ }
  if (!r.ok) {
    const msg = body && body.error ? body.error : (raw.slice(0, 200) || r.statusText);
    errorState(r.status === 413 ? "Input too large" : `The server rejected the request (HTTP ${r.status})`, msg, r.status >= 500 ? () => run() : null);
    return;
  }
  if (!Array.isArray(body) || !body.every(x => x && typeof x.text === "string")) { errorState("Unexpected response from the server", "Expected a list of output files.", () => run()); return; }
  const docs = body.map(x => JSON.parse(x.text));
  const inputs = Array.isArray(parsed) ? parsed : [parsed];
  const diffs = docs.map(d => {
    const key = d.scenario_id, cur = snapshot(d); let df = null;
    if (key != null && PREV[key]) df = diffSnap(PREV[key], cur);
    if (key != null) PREV[key] = cur;
    return df;
  });
  const budgets = docs.map((d, i) => { const b = inputs[i] && getPath(inputs[i], "budget.monthly_infra_usd"); return typeof b === "number" ? b : null; });
  RES = {docs, files: body, diffs, budgets, sel: 0};
  renderResults();
  say(docs.length === 1 ? note(0) : `${docs.length} scenarios evaluated`);
  afterRun(opts.noScroll);
}

/* ---------- counterfactual edits ---------- */
function editTarget(doc) {
  if (mode === "form") { const o = formToObj(); if (doc.scenario_id != null && (o.scenario_id || null) !== doc.scenario_id && RES.docs.length === 1) return {err: "The form now holds a different scenario than this result. Re-run first."}; return {obj: o, write: () => { objToForm(o); baseText = JSON.stringify(o, null, 2); dirty = false; $("json").value = baseText; }}; }
  let v; try { v = JSON.parse($("json").value); } catch (e) { return {err: "The JSON tab does not parse, so the edit cannot be applied."}; }
  const arr = Array.isArray(v), o = arr ? v.find(x => isObj(x) && x.scenario_id === doc.scenario_id) : v;
  if (!isObj(o)) return {err: "Could not find this scenario in the current JSON."};
  return {obj: o, write: () => { $("json").value = JSON.stringify(v, null, 2); updateJsonStat(); }};
}
function applyEdit(doc, w) {
  const t = editTarget(doc); if (t.err) { flashMsg(t.err); $("inErr").textContent = t.err; return; }
  const before = getPath(t.obj, w.path);
  setPath(t.obj, w.path, w.value); t.write();
  LASTEDIT = {path: w.path, before, edit: w.edit, doc};
  run({keepEdit: true, noScroll: true});
}
function undoEdit() {
  if (!LASTEDIT) return;
  const t = editTarget(LASTEDIT.doc); if (t.err) { $("inErr").textContent = t.err; return; }
  if (LASTEDIT.before === undefined) deletePath(t.obj, LASTEDIT.path); else setPath(t.obj, LASTEDIT.path, LASTEDIT.before);
  t.write(); LASTEDIT = null; run({noScroll: true});
}

/* ---------- export / print ---------- */
const curFile = () => RES && RES.files[RES.sel];  // {name, text}: the exact bytes the CLI would write
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  const ta = h("textarea", {class: "sr-only"}); ta.value = t; document.body.append(ta); ta.select();
  try { document.execCommand("copy"); } finally { ta.remove(); } return Promise.resolve();
}
let reopen = [];
addEventListener("beforeprint", () => { reopen = [...document.querySelectorAll("#results details:not([open])")]; reopen.forEach(d => { d.open = true; }); });
addEventListener("afterprint", () => { reopen.forEach(d => { d.open = false; }); reopen = []; });

/* ---------- init ---------- */
function applyHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const s = p.get("sample");
  if (s) {
    const i = s.toLowerCase() === "all" ? "all" : findSample(s);
    if (i === -1) { $("inErr").textContent = `Unknown sample "${s}". Choose one from the list.`; return; }
    $("sample").value = String(i); loadSampleAt(i);
  }
  if (p.get("mode") === "json") setMode("json");
  if (p.get("run") === "1") run({noScroll: true}).then(() => { const n = Number(p.get("sel")); if (RES && n > 0 && n < RES.docs.length) selectDoc(n); });
}

async function init() {
  READY = false; syncRun(); $("resBody").setAttribute("aria-busy", "true");
  try {
    const [sc, sm] = await Promise.all([fetch("/api/schema"), fetch("/api/samples")]);
    if (!sc.ok || !sm.ok) throw new Error("HTTP " + (sc.ok ? sm.status : sc.status));
    SCHEMA = (await sc.json()).map(f => ({...f, kind: {xint: "int", xenum: "enum", xlist: "str_list"}[f.kind] || f.kind}));
    SAMPLES = await sm.json();
  } catch (e) {
    errorState("Cannot reach the StackSense server", "Cannot reach the StackSense server — is `python stacksense.py serve` still running? The input schema and samples could not be loaded, so Recommend is disabled until this works.", init);
    return;
  }
  READY = true; syncRun();
  buildForm(); showMode(mode);
  const sel = $("sample"); sel.length = 1;
  sel.append(h("optgroup", {label: "Batch"}, h("option", {value: "all", text: `All ${SAMPLES.filter(s => typeof s.scenario !== "string").length} samples as one array`})));
  const groups = new Map();
  SAMPLES.forEach((s, i) => { const g = s.group || "Samples"; if (!groups.has(g)) groups.set(g, h("optgroup", {label: g})); groups.get(g).append(h("option", {value: String(i), text: s.label})); });
  groups.forEach(g => sel.append(g));
  renderResults();
  applyHash();
}

$("sample").onchange = e => { const v = e.target.value; if (v !== "") loadSampleAt(v); };
$("importBtn").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const t = await f.text(); let o = null; try { o = JSON.parse(t); } catch (err) { /* shown as text; the engine reports the JSON error */ }
  $("sample").value = ""; $("inErr").textContent = "";
  if (isObj(o)) loadObj(o, t); else loadText(t);
};
$("exportIn").onclick = () => {
  const t = currentText(); let id = null; try { const v = JSON.parse(t); id = isObj(v) ? v.scenario_id : null; } catch (e) { /* unnamed */ }
  download(id ? fileSafe(id) + "_input.json" : "scenario.json", t);
};
$("reset").onclick = () => {
  FIELDS.forEach(f => f.set(undefined)); STASH = {}; baseText = null; dirty = false; $("inNote").textContent = ""; $("inErr").textContent = ""; $("runMsg").textContent = ""; $("json").value = ""; $("sample").value = "";
  RES = null; LASTEDIT = null; if (mode === "json") { updateJsonStat(); } renderResults(); say("Input cleared");
};
$("tabForm").onclick = () => setMode("form"); $("tabJson").onclick = () => setMode("json");
wireTabs($("inTabs"), t => { if (!setMode(t.id === "tabJson" ? "json" : "form")) $(mode === "json" ? "tabJson" : "tabForm").focus(); });
$("json").addEventListener("input", updateJsonStat);
document.querySelectorAll(".runbtn").forEach(b => { b.onclick = () => run(); });
$("cancelRun").onclick = () => { if (ABORT) ABORT.abort(); };
$("skipRes").onclick = goResults;
$("skipTop").onclick = e => { e.preventDefault(); goResults(); };
$("exportOut").onclick = () => { const f = curFile(); if (f) download(f.name, f.text); };
$("exportAll").onclick = () => { if (RES) RES.files.forEach(f => download(f.name, f.text)); };
$("copyOut").onclick = () => { const f = curFile(); if (!f) return; copyText(f.text).then(() => flashMsg("Copied"), () => flashMsg("Copy blocked by the browser")); };
$("printBtn").onclick = () => print();
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); } });
addEventListener("hashchange", () => { if (READY) applyHash(); });
init();
</script>
